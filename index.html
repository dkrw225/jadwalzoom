<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencarian Jadwal Zoom</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    background: #f5f5f5;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 5px #ccc;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
    color: #333;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin-top: 10px;
}

label:first-of-type {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0 15px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
}

.table-container {
    width: 100%;
    overflow-x: auto;
    background: white;
    border-radius: 8px;
    box-shadow: 0 0 5px #ccc;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
    white-space: nowrap;
}

th {
    background: #2196F3;
    color: white;
}
</style>
</head>

<body>

<div class="card">
    <h2>Cek Jadwal Zoom</h2>

    <label for="g1">Dari Tanggal</label>
    <input id="g1" type="date">

    <label for="h1">Sampai Tanggal</label>
    <input id="h1" type="date">

    <button id="btnCari" onclick="cari()">Cari</button>
</div>

<div class="table-container">
    <table id="hasil">
        <thead>
            <tr>
                <th>Tanggal Input</th>
                <th>Pengisi</th>
                <th>Acara</th>
                <th>Tanggal Acara</th>
                <th>Jam</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
const url = "https://script.google.com/macros/s/AKfycbzq6af-uvGDFcEdZ5xK-0c3ZR_T4CIdeMwaYfoXFt0EZnP5mTlrhkb99-BDleBmMTou/exec";

function cari() {
    let g = document.getElementById("g1").value;
    let h = document.getElementById("h1").value;
    let btn = document.getElementById("btnCari");
    let tbody = document.querySelector("#hasil tbody");

    // Status loading
    btn.innerText = "Memuat...";
    btn.disabled = true;
    tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Sedang mencari data...</td></tr>";

    // Kirim via GET parameter (jauh lebih cepat daripada POST)
    let queryUrl = `${url}?g1=${encodeURIComponent(g)}&h1=${encodeURIComponent(h)}`;

    fetch(queryUrl)
    .then(r => r.json())
    .then(data => {
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Data tidak ditemukan</td></tr>";
            return;
        }

        data.forEach(row => {
            let tr = document.createElement("tr");
            row.forEach(col => {
                let td = document.createElement("td");
                td.innerText = col;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    })
    .catch(err => {
        console.error(err);
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Gagal memuat data</td></tr>";
        alert("Gagal mengambil data: " + err);
    })
    .finally(() => {
        btn.innerText = "Cari";
        btn.disabled = false;
    });
}
</script>

</body>
</html>
